name: CI/CD Backend (Azure Container Apps)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_REPO: docker.io/${{ secrets.DOCKER_HUB_USER }}/traiga-be
  AZURE_APP: demo-webtraiga
  AZURE_RG: jaika_group

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -v ./...

  build-and-push:
    name: Build & push Docker image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tag theo commit SHA để Azure luôn tạo revision mới (tag :latest không trigger update)
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update container app image
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -e
            az extension add --name containerapp --upgrade --only-show-errors
            # Backend lắng nghe cổng 8000; transport auto hỗ trợ cả HTTP & WebSocket
            az containerapp ingress update -n "$AZURE_APP" -g "$AZURE_RG" \
              --target-port 8000 --transport auto --only-show-errors -o none
            az containerapp update -n "$AZURE_APP" -g "$AZURE_RG" \
              --image "$IMAGE_REPO:${{ github.sha }}" --only-show-errors \
              --query properties.configuration.ingress.fqdn -o tsv
            az containerapp update -n "$AZURE_APP" -g "$AZURE_RG" \
              --set-env-vars "SRS_HTTP_URL=$SRS_HTTP_URL" --only-show-errors -o none
            az containerapp update -n "$AZURE_APP" -g "$AZURE_RG" \
              --set-env-vars \
                "GOOGLE_DRIVE_CLIENT_ID=${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}" \
                "GOOGLE_DRIVE_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}" \
                "GOOGLE_DRIVE_REFRESH_TOKEN=${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}" \
                "GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}" \
              --only-show-errors -o none
        env:
          SRS_HTTP_URL: ${{ vars.SRS_HTTP_URL || 'http://103.82.26.60:8080' }}
